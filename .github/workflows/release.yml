name: Release

# Push a tag like v0.1.0 to build the DMG and attach it to a GitHub Release.
# Running it by hand (Actions → Release → Run workflow) builds the DMG as a
# downloadable workflow artifact without making a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app and DMG (Apple silicon + Intel)
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-dev"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          UNIVERSAL=1 BUILD_NUMBER="$GITHUB_RUN_NUMBER" ./build.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: PomTiempo-${{ env.VERSION }}
          path: dist/*.dmg

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg \
            --title "PomTiempo $VERSION" \
            --notes-file .github/release-notes.md \
          || gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber
